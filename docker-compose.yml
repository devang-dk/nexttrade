# =====================================================================
# NexTrade — docker-compose.yml
# Services: backend · react client · nginx · prometheus · grafana · jenkins
# =====================================================================

name: nextrade   # fixes project name regardless of which directory compose runs from

services:

  # ── MongoDB ──────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: nextrade-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - nextrade-net

  # ── Backend: Node.js / Express API ──────────────────────────────────
  server:
    image: ronnie75491/nextrade-server:latest   # pulled by Jenkins deploy
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nextrade-server
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MARKET_API_KEY: ${MARKET_API_KEY}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nextrade-net

  # ── React Client ────────────────────────────────────────────────────
  client:
    image: ronnie75491/nextrade-client:latest   # pulled by Jenkins deploy
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:10000}
    container_name: nextrade-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - nextrade-net

  # ── Nginx: Serves the static HTML frontend ───────────────────────────
  frontend:
    image: nginx:1.27-alpine
    container_name: nextrade-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - nextrade-net

  # ── Prometheus: Metrics Scraper ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: nextrade-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"          # allows hot-reload via POST /-/reload
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - nextrade-net

  # ── Grafana: Dashboards & Visualisation ─────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: nextrade-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nextrade123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - nextrade-net

  # ── Jenkins: CI/CD ───────────────────────────────────────────────────
  jenkins:
    image: stock-jenkins:latest   # built locally; never auto-redeployed by pipeline
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: nextrade-jenkins
    restart: unless-stopped
    privileged: true                      # needed to run Docker inside Jenkins
    user: root
    ports:
      - "8090:8080"                       # Jenkins UI
      - "50000:50000"                     # Jenkins agent port
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_OPTS: "--prefix=/jenkins"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-in-Docker via socket
    networks:
      - nextrade-net

# ── Named Volumes ────────────────────────────────────────────────────
volumes:
  mongodb-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jenkins-data:
    driver: local

# ── Network ──────────────────────────────────────────────────────────
networks:
  nextrade-net:
    driver: bridge
