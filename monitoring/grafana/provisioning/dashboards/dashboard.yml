# =====================================================================
# Grafana — Dashboard Provider
# Loads all JSON dashboards from /var/lib/grafana/dashboards
# =====================================================================

apiVersion: 1

providers:
  - name: "NexTrade Dashboards"
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
